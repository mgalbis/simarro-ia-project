services:
  pipeline:
    image: python:3.10-slim
    container_name: simarro-pipeline
    ports:
      - "8080:8080"

    volumes:
      - ../pipeline_server.py:/app/pipeline_server.py
      - ../pipeline_train.py:/app/pipeline_train.py
      - ../requirements.txt:/app/requirements.txt

    working_dir: /app

    # Instalación de dependencias y arrancamos el servidor
    command: bash -c "apt-get update -qq && apt-get install -y -qq curl && pip install --quiet -r requirements.txt && python pipeline_server.py"
    environment:
      PIPELINE_PORT: 8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LAKEFS_ENDPOINT: http://lakefs:8000
      LAKEFS_ACCESS_KEY_ID: ${LAKEFS_ACCESS_KEY_ID}
      LAKEFS_SECRET_ACCESS_KEY: ${LAKEFS_SECRET_ACCESS_KEY}

    depends_on:
      mlflow:
        condition: service_healthy
      lakefs:
        condition: service_healthy

    healthcheck:
      test: [
          "CMD-SHELL",
          # Según el SO hay que ajustar las comillas
          # Windows
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080'')" || exit 1',
          # Linux
          #"python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080\")' || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

name: simarro-ia-project

services:

  aclserver-db:
    image: postgres:16-alpine
    container_name: simarro-aclserver-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lakefs_acl
      POSTGRES_USER: lakefs_acl
      POSTGRES_PASSWORD: lakefs_acl
    volumes:
      - aclserver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakefs_acl -d lakefs_acl"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  aclserver:
    image: simarro/aclserver:latest
    build:
      context: .
      dockerfile: docker/aclserver/Dockerfile
    container_name: simarro-aclserver
    restart: unless-stopped
    environment:
      ACLSERVER_LISTEN_ADDRESS: 0.0.0.0:8001
      ACLSERVER_DATABASE_TYPE: postgres
      ACLSERVER_DATABASE_POSTGRES_CONNECTION_STRING: postgres://lakefs_acl:lakefs_acl@aclserver-db:5432/lakefs_acl?sslmode=disable
      ACLSERVER_ENCRYPT_SECRET_KEY: ${LAKEFS_SECRET_KEY}
    depends_on:
      aclserver-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/_health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  lakefs:
    image: simarro/lakefs:latest
    build:
      context: .
      dockerfile: docker/lakefs/Dockerfile
    container_name: simarro-lakefs
    restart: unless-stopped
    user: root
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_DATABASE_LOCAL_PATH: /data/metadata
      LAKEFS_BLOCKSTORE_TYPE: local
      LAKEFS_BLOCKSTORE_LOCAL_PATH: /data
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_SECRET_KEY}
      LAKEFS_AUTH_UI_CONFIG_RBAC: simplified
      LAKEFS_AUTH_API_ENDPOINT: http://aclserver:8001/api/v1
      LAKEFS_ACCESS_KEY_ID: ${LAKEFS_ACCESS_KEY_ID}
      LAKEFS_SECRET_ACCESS_KEY: ${LAKEFS_SECRET_ACCESS_KEY}
      LAKEFS_INSTALLATION_USER_NAME: admin
      LAKEFS_SETUP_COMM_PREFS_EMAIL: ${LAKEFS_SETUP_COMM_PREFS_EMAIL:-mlops@ies-simarro.es}
      LAKEFS_CASE_USERS_SECRET_KEY: ${DEFAULT_USER_PASSWORD}
    volumes:
      - lakefs-data:/data
    depends_on:
      aclserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "lakefs", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mlflow:
    image: simarro/mlflow:latest
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: simarro-mlflow
    restart: unless-stopped
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      lakefs:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/mlflow/', timeout=5)"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jupyterhub:
    image: simarro/jupyterhub:latest
    build:
      context: .
      dockerfile: docker/jupyterhub/Dockerfile
      args:
        JUPYTERHUB_IMAGE: ${JUPYTERHUB_IMAGE}
        PIP_TOOLS_VERSION: ${PIP_TOOLS_VERSION}
    container_name: simarro-jupyterhub
    restart: unless-stopped
    volumes:
      - jupyterhub-data:/srv/jupyterhub
    environment:
      JUPYTERHUB_ADMIN: admin
      CASES_CONFIG_PATH: /app/config/cases_config.json
      JUPYTERHUB_CASE_USERS_PASSWORD: ${DEFAULT_USER_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000/mlflow
      LAKEFS_ENDPOINT: http://lakefs:8000
      LAKEFS_ACCESS_KEY_ID: ${LAKEFS_ACCESS_KEY_ID}
      LAKEFS_SECRET_ACCESS_KEY: ${LAKEFS_SECRET_ACCESS_KEY}
    depends_on:
      mlflow:
        condition: service_healthy
      lakefs:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/jupyter/hub/health', timeout=5)"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    container_name: simarro-nginx
    restart: unless-stopped
    ports:
      - "81:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/index.html:/usr/share/nginx/html/index.html:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      mlflow:
        condition: service_healthy
      lakefs:
        condition: service_healthy
      jupyterhub:
        condition: service_healthy

volumes:
  mlflow-data:
  lakefs-data:
  jupyterhub-data:
  aclserver-db-data:

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Evita inyectar el botón "Inicio" dentro de documentos cargados en iframes.
  map $http_sec_fetch_dest $home_button {
    default '<a href="/" title="Inicio" aria-label="Inicio" style="position:fixed;right:30px;bottom:24px;z-index:2147483647;width:48px;height:48px;border-radius:9999px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V21h14V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 21v-6h4v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
    iframe  '';
    frame   '';
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;

    location = / {
      try_files /index.html =404;
    }

    location /jupyter/ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600;
      proxy_set_header Accept-Encoding "";
      proxy_pass http://jupyterhub:8000;
      sub_filter '</body>' '$home_button</body>';
    }

    location /mlflow/ {
      proxy_set_header Accept-Encoding "";
      proxy_pass http://mlflow:5000;
      sub_filter '</body>' '$home_button</body>';
    }

    location /lakefs/ {
      rewrite ^/lakefs/?(.*)$ /$1 break;
      proxy_set_header Accept-Encoding "";
      proxy_pass http://lakefs:8000;
      sub_filter '</body>' '$home_button</body>';
    }

    # Servir archivos estáticos locales (p. ej. /index.html, /favicon.png) y
    # usar lakeFS como fallback para rutas no existentes.
    location / {
      try_files $uri @lakefs;
    }

    # lakeFS UI usa rutas absolutas (/assets, /api, etc.). Este fallback
    # mantiene su funcionamiento cuando no hay fichero estático local.
    location @lakefs {
      proxy_pass http://lakefs:8000;
    }
  }
}

name: Code quality

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**.py"
  workflow_dispatch:

env:
  PYTHONPATH: src
  PYTHON_VERSION: "3.10"

jobs:
  unit-quality:
    name: Validate Python code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

      - name: Run unit tests with coverage
        run: |
          python -m pytest "test/mlops/" \
            --cov=src/simarro/mlops \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

  integration-tests:
    name: Integration tests with Docker
    runs-on: ubuntu-latest
    needs: unit-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Restore Docker images cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-image-cache
          key: ${{ runner.os }}-docker-images-${{ hashFiles('docker-compose.yml') }}

      - name: Load cached Docker images
        run: |
          if [ -f /tmp/.docker-image-cache/images.tar ]; then
            docker load -i /tmp/.docker-image-cache/images.tar
          fi

      - name: Start MLOps stack
        run: |
          cp .env.example .env
          docker compose pull --quiet
          docker compose up --wait

      - name: Save Docker images for cache
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/.docker-image-cache
          IMAGES=$(docker compose config --images | sort -u)
          if [ -n "$IMAGES" ]; then
            docker image save -o /tmp/.docker-image-cache/images.tar $IMAGES
          fi

      - name: Run integration tests
        run: |
          python -m pytest test/integration/mlops -m integration

      - name: Stop Docker stack
        if: always()
        run: |
          docker compose down -v

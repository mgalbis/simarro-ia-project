services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_VERSION: "3.14"
    container_name: qabot-backend
    restart: unless-stopped
    volumes:
      - qabot_data:/app/app/data
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_VERSION: "24"
        VITE_API_BASE_URL: ""
    container_name: qabot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  qabot_data:
